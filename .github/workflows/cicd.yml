name: cicd

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize]

env:
  FLUTTER_MIN_VERSION: '3.35.0'

jobs:
  # BEGIN LINTING STAGE
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/melos-action@v3
      - run: melos run format-check

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{env.FLUTTER_MIN_VERSION}}
      - uses: bluefireteam/melos-action@v3
      - run: melos analyze

  analyze-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
      - uses: bluefireteam/melos-action@v3
      - name: "Analyze with latest stable"
        uses: invertase/github-action-dart-analyzer@v3
        with:
          fatal-infos: true

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install -g markdownlint-cli
      - run: markdownlint . -p .markdownlintignore -c .markdownlint.yaml

  super-linter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: super-linter/super-linter@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          DEFAULT_BRANCH: main
          VALIDATE_CLANG_FORMAT: true
  # END LINTING STAGE

  # BEGIN TESTING STAGE
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          cache: true
      - uses: bluefireteam/melos-action@v3
      - name: Run tests
        run: melos test
  # END TESTING STAGE

  # BEGIN PLATFORM BUILD STAGE
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: windows --debug
          - os: ubuntu-latest
            platform: linux
            command: linux --debug
          - os: ubuntu-latest
            platform: android
            command: apk --debug
          - os: ubuntu-latest
            platform: web
            command: web --release
          - os: macos-latest
            platform: macos
            command: macos --debug
          - os: macos-latest
            platform: ios
            command: ios --simulator --debug --no-codesign
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          cache: true
      - if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - name: Generate example platform runner
        working-directory: packages/gamepads/example
        run: flutter create --platforms=${{ matrix.platform }} --project-name gamepads_example --no-pub .
      - name: Compile platform implementation
        working-directory: packages/gamepads/example
        run: flutter build ${{ matrix.command }}
      - name: Configure Windows rumble regression
        if: matrix.platform == 'windows'
        run: cmake -S packages/gamepads_windows/windows/test -B build/rumble-test
      - name: Build Windows rumble regression
        if: matrix.platform == 'windows'
        run: cmake --build build/rumble-test --config Release
      - name: Run Windows rumble regression
        if: matrix.platform == 'windows'
        run: ctest --test-dir build/rumble-test -C Release --output-on-failure
      - name: Run Linux rumble regression
        if: matrix.platform == 'linux'
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror packages/gamepads_linux/linux/test/rumble_test.cpp -o "$RUNNER_TEMP/rumble_test"
          "$RUNNER_TEMP/rumble_test"
  # END PLATFORM BUILD STAGE
